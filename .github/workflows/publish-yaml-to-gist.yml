name: Publish YAML changes to Gists

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/gist_url.txt'   # (optional) handle changes in mapping files too

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed YAML files
        id: diff
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # Make sure BEFORE exists locally (merge/force-push safety)
          git fetch --no-tags --prune --depth=200 origin +$BEFORE:$BEFORE || true
          # List potentially changed yaml/yml, space-separated
          files=$(git diff --name-only "$BEFORE" "$AFTER" -- '**/*.yml' '**/*.yaml' | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Build per-gist PATCH payloads
        if: steps.diff.outputs.files != ''
        id: build
        run: |
          set -euo pipefail
          mkdir -p .gist-patches

          # For each changed file, if it still exists, map it to the sibling gist_url.txt
          for f in ${{ steps.diff.outputs.files }}; do
            # Skip deletions / renames where target no longer exists
            if [ ! -f "$f" ]; then
              echo "Skip (deleted/non-file): $f"
              continue
            fi

            dir=$(dirname "$f")
            map="$dir/gist_url.txt"
            if [ ! -f "$map" ]; then
              echo "No gist_url.txt in $dir — skipping $f"
              continue
            fi

            url=$(tr -d '\r' < "$map" | head -n1)
            if [ -z "$url" ]; then
              echo "Empty gist_url.txt in $dir — skipping $f"
              continue
            fi

            # Extract the last non-empty path segment as the gist ID
            # Works for https://gist.github.com/<user>/<id>[?…] and https://gist.github.com/<id>
            gist_id=$(printf "%s" "$url" | awk -F'/' '{for(i=NF;i>=1;i--) if($i!=""){print $i; break}}' | sed 's/[?#].*$//')
            if [ -z "$gist_id" ]; then
              echo "Could not parse gist id from URL '$url' — skipping $f"
              continue
            fi

            base=$(basename "$f")
            # Read content safely (no trailing CRs)
            content=$(cat "$f")

            patch_file=".gist-patches/${gist_id}.json"
            if [ ! -f "$patch_file" ]; then
              # Initialize an empty JSON: { "files": {} }
              printf '{"files":{}}' > "$patch_file"
            fi

            # Merge this file content into the pending PATCH body
            # Resulting body: { "files": { "<base>": { "content": "..." }, ... } }
            tmp=$(mktemp)
            jq --arg fn "$base" --arg c "$content" \
               '.files[$fn] = {content: $c}' "$patch_file" > "$tmp"
            mv "$tmp" "$patch_file"

            echo "Queued $f -> gist $gist_id as $base"
          done

          # Export list of gist ids we built patches for
          ids=$(ls .gist-patches/*.json 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.json$//' | tr '\n' ' ')
          echo "gist_ids=${ids}" >> "$GITHUB_OUTPUT"

      - name: PATCH update gists
        if: steps.build.outputs.gist_ids != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          for id in ${{ steps.build.outputs.gist_ids }}; do
            body_file=".gist-patches/${id}.json"
            echo "Updating gist $id"
            # PATCH the gist with all accumulated file updates
            http_code=$(curl -sS -o /tmp/curl_out.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: token ${GIST_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d @"${body_file}" \
              "https://api.github.com/gists/${id}")

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              url=$(jq -r '.html_url' /tmp/curl_out.json)
              echo "Updated: ${url}"
            else
              echo "Failed to update gist ${id} (HTTP ${http_code})"
              cat /tmp/curl_out.json || true
              exit 1
            fi
          done
